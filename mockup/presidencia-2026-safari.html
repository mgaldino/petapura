#presidencia-2026-preview input[type=&quot;range&quot;]{min-height:44px;width:100%;accent-color:var(--pres-a)}
#presidencia-2026-preview .pres-method{border-top:1px solid var(--pres-rule);margin-top:9px}
#presidencia-2026-preview summary{min-height:48px;padding:13px 0;font-size:14px}
#presidencia-2026-preview .pres-method-content{max-width:720px;padding:0 0 14px}
#presidencia-2026-preview .pres-method-content p{font-size:14px;color:var(--pres-muted);margin:8px 0}
#presidencia-2026-preview .pres-method-content .pres-probability{font-size:18px;color:var(--pres-ink);font-weight:500}
#presidencia-2026-preview .pres-footer{font-size:12px;color:var(--pres-muted);border-top:1px solid var(--pres-rule);padding-top:17px}
#presidencia-2026-preview .pres-footer p{margin:0}
#presidencia-2026-preview .pres-footer .pres-credit{font-size:14px;color:var(--pres-ink);margin-bottom:7px}
#presidencia-2026-preview .pres-credit strong{font-weight:500}
#presidencia-2026-preview .pres-live-summary{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@container(max-width:650px){
  #presidencia-2026-preview .pres-product{padding:0 20px 22px}
  #presidencia-2026-preview .pres-demo{margin:0 -20px;padding:10px 20px;font-size:11px;letter-spacing:.04em}
  #presidencia-2026-preview .pres-masthead{padding:21px 0 17px}
  #presidencia-2026-preview .pres-wordmark{font-size:23px}
  #presidencia-2026-preview .pres-wordmark span{font-size:16px}
  #presidencia-2026-preview .pres-edition{display:none}
  #presidencia-2026-preview .pres-meta{font-size:12px;gap:4px;padding:12px 0}
  #presidencia-2026-preview .pres-intro{padding:23px 0 20px}
  #presidencia-2026-preview h1{font-size:30px;letter-spacing:-.9px}
  #presidencia-2026-preview .pres-intro p{font-size:14px}
  #presidencia-2026-preview .pres-hero{grid-template-columns:1fr;gap:23px;padding:23px 20px}
  #presidencia-2026-preview .pres-number{font-size:82px;letter-spacing:-4px}
  #presidencia-2026-preview .pres-denominator{font-size:14px}
  #presidencia-2026-preview .pres-uncertainty{border-left:0;border-top:1px solid var(--pres-rule);padding:21px 0 0}
  #presidencia-2026-preview .pres-range-value{font-size:25px}
  #presidencia-2026-preview .pres-counted{display:block;padding:21px 0}
  #presidencia-2026-preview .pres-counted-results{display:block;margin-top:9px}
  #presidencia-2026-preview .pres-counted-results p+p{margin-top:5px}
  #presidencia-2026-preview .pres-counted-results b{font-size:19px}
  #presidencia-2026-preview .pres-history-header{gap:9px}
  #presidencia-2026-preview .pres-chart-legend{gap:21px}
  #presidencia-2026-preview .pres-history-plot{height:310px}
  #presidencia-2026-preview .pres-scrub{gap:10px}
}

(()=&gt;{
  const root=document.getElementById(&#x27;presidencia-2026-preview&#x27;);

    if([&#x27;Sistema&#x27;,&#x27;Claro&#x27;,&#x27;Escuro&#x27;].includes(settings.theme))state.theme=settings.theme;
    if(typeof settings.showA===&#x27;boolean&#x27;)state.showA=settings.showA;
    if(typeof settings.showB===&#x27;boolean&#x27;)state.showB=settings.showB;
  }
  const saved=window.openai?.widgetState?.modelContent;
  if(saved?.kind===&#x27;presidential-mockup&#x27;)applySettings(saved.settings);
  const fmt=(x,d=1)=&gt;Number(x).toLocaleString(&#x27;pt-BR&#x27;,{minimumFractionDigits:d,maximumFractionDigits:d});
  const storeState=()=&gt;window.openai?.setWidgetState?.({modelContent:{kind:&#x27;presidential-mockup&#x27;,settings:{...state}},privateContent:null}).catch(()=&gt;{});

  const low=Math.floor((Math.min(...series.map(m=&gt;m.bounds[0][0]))-2)/5)*5;

    const lerp=(a,b,t)=&gt;a+(b-a)*t;
    for(let i=0;i&lt;2;i++){
      if(!shown[i])continue;
      const c=colors[i],actual=m.actual[i],b=m.bounds[i],target=m.point[i];
